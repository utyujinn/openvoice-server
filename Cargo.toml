[package]
name = "openvoice-server"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "OpenVoice V2 (MeloTTS English + tone color converter) for Mutelink: English text in, speech in the reference voice out. Runs as a child process of the app, like irodori-server."

# Its own workspace, apart from tauri-src/src-tauri's: this crate needs the upstream `ort`, and the app's graph
# already holds voicevox_core's fork of it (both declare `links = "onnxruntime"`, which Cargo allows only once
# per graph). Build it on its own: `cargo build --release` in this folder.
[workspace]

[dependencies]
anyhow = "1"
hound = "3.5.1"
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.14", default-features = false, features = ["load-dynamic", "ndarray", "cuda"] }
realfft = "3.5.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
unicode-normalization = "0.1"

# The text tests walk hundreds of sentences through the neural g2p; at opt-level 0 that took minutes.
[profile.test]
opt-level = 2
